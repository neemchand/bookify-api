name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the sections below.
        For security vulnerabilities, do **not** use this form — see [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I POST /bookings twice with the same idempotency key, ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact steps (commands, requests) to reproduce the behaviour.
      placeholder: |
        1. `pnpm infra:up && pnpm db:migrate && pnpm db:seed`
        2. Log in as alice@example.com
        3. curl -X POST ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste any error output. This will be rendered as code, no need for backticks.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, and how you're running the infra (docker compose, etc.)
      placeholder: |
        - Node: 24.x
        - OS: Ubuntu 24.04
        - Infra: docker compose (pnpm infra:up)
    validations:
      required: true

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure environment
        # Tests read config from .env (see tests/setup/env.ts); the example
        # already points at the docker compose ports.
        run: cp .env.example .env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type-check / build
        run: pnpm build

      - name: Start infrastructure (Postgres, Redis, Kafka)
        run: pnpm infra:up

      - name: Run tests
        run: pnpm test

      - name: Tear down infrastructure
        if: always()
        run: pnpm infra:down

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bookify:ci .
